        html_output: html-output,ho
        json_output: json_output,jo
        level: level
        log_level: log-level
        plugins: plugins
        poc: poc
        stdout: stdout
        tags: tags
        text_output: text-output,to
        webhook_output: webhook-output,wo
    html_output: ""
    json_output: ""
    level: ""
    log_level: ""
    plugins: ""
    poc: ""
    stdout: true
    tags: ""
    text_output: ""
    webhook_output: ""

