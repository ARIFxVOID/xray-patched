Client:
    active_paths: []
    allow_methods:
        - HEAD
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - CONNECT
        - TRACE
        - MOVE
        - PROPFIND
    dial_timeout: 5
    enable_http2: false
    fail_retries: 0
    headers: {}
    max_conns_per_host: 50
    max_qps: 500
    max_redirect: 5
    max_resp_body_size: 2.097152e+06
    passive_mode: false
    pkcs12:
        Password: ""
        Path: ""
    proxy: ""
    proxy_rule: null
    read_timeout: 10
Pool:
    size: 100
Reverse:
    client:
        dns_server_ip: ""
        http_base_url: ""
        remote_server: false
        reverse_api: ""
        reverse_server_url: ""
        rmi_server_addr: ""
    db_file_path: ""
    dns:
        domain: ""
        enabled: false
        is_domain_name_server: false
        listen_ip: 0.0.0.0
        resolve:
            - record: localhost
              ttl: 60
              type: A
              value: 127.0.0.1
    http:
        enabled: false
        ip_header: ""
        listen_ip: 0.0.0.0
        listen_port: ""
    rmi:
        enabled: false
        listen_ip: 127.0.0.1
        listen_port: ""
    token: ""

